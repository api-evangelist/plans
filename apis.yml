aid: plans
name: Plans
description: >-
  Plans (plans.app, formerly lun.energy) is a climate-technology company focused on
  decarbonising the built world. It removes the friction that stands in the way of
  transitioning homes to low-carbon energy faster, letting professionals capture
  building data on a mobile device, analyze it, and produce retrofit / energy plans —
  "capture, analyze, plan, all in your pocket." A web platform (platform.plans.app) and
  a Chrome extension support the workflow, and the product is offered across English,
  Danish, and French markets. Plans is backed by Partech. No public developer API has
  been identified during enrichment; the platform is a login-gated single-page
  application and the site exposes no OpenAPI, SDKs, docs, or developer portal.
